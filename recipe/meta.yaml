{% set python_min = "3.11" %}
{% set name = "pyramids" %}
{% set version = "0.79.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/serapeum-org/pyramids-core/archive/{{ version }}.tar.gz
  sha256: a186a3e1f19957df0a63eff44e3dc54e0ea9a1992ba2dc4c5140e05058d1195e

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip >=24.3.1
    - setuptools >=80.0.0
    - wheel
  run:
    - python >={{ python_min }}
    - cftime >=1.6.4
    - geopandas >=1.0.0
    - hpc >=0.1.5
    - numpy >=2.0.0
    - pandas >=2.0.0
    - pyproj >=3.7.0
    - PyYAML >=6.0.0
    - Shapely >=2.1.0
    - scipy >=1.10.0
    - gdal >=3.10.0,<4
    - libgdal-netcdf >=3.10.0,<4
    - libgdal-hdf4 >=3.10.0,<4
    # libgdal-grib provides the GRIB driver pyramids.grib.open_grib needs.
    - libgdal-grib >=3.10.0,<4
    # libgdal-jp2openjpeg ships the JP2OpenJPEG driver (pulls openjpeg) so
    # GDAL can read JPEG2000-packed GRIB2 (WMO template 5.40 —
    # NCEP/ECCC/ECMWF).
    - libgdal-jp2openjpeg >=3.10.0,<4
    # conda-forge's geopandas-base no longer pulls a vector-IO backend;
    # pyogrio is required for GeoDataFrame.to_file / read_file on every env.
    - pyogrio >=0.7

  run_constrained:
    # viz — `cleopatra-tiles` is the conda-forge equivalent of the PyPI
    # `cleopatra[tiles]` extra (pulls cleopatra + mercantile + xyzservices + Pillow).
    - cleopatra-tiles >=0.44.0
    # xarray — peer interop dep (no longer a dedicated extra in pyproject 0.33.0)
    - xarray >=2023.1.0
    # lazy — now also bundles kerchunk + h5py for the NetCDF/HDF5 lazy path.
    # h5py must come from conda-forge: PyPI h5py wheels bundle their own HDF5
    # and DLL-shadow on Windows once two HDF5 backends load in-process.
    # hdf5 is held at 1.14.* NOT because libgdal-netcdf lacks hdf5 2.x builds
    # (it ships both, as does h5py 3.16) but because of the shared AWS-SDK:
    # GDAL (/vsis3/) and Arrow (S3 parquet) link one aws-sdk-cpp, and the
    # hdf5-2 GDAL builds pin a different AWS-SDK patch than libarrow needs, so
    # hdf5 2.x does not co-solve with the arrow/parquet stack yet — see
    # serapeum-org/pyramids-core#1419. The <3.17 cap vets a future 3.17 first.
    - dask-core >=2024.1.0
    - distributed >=2024.1.0
    - zarr >=3
    - fsspec >=2024.1.0
    - s3fs >=2024.1.0
    - kerchunk >=0.2.10
    - h5py >=3.8.0,<3.17
    - hdf5 1.14.*
    # parquet — now also bundles dask-geopandas (the former parquet-lazy extra).
    - pyarrow >=10.0.0
    - dask-geopandas >=0.5.0
    # stac — conda-forge equivalent of the PyPI `stac` extra. The PyPI extra also
    # pins stac-asset>=0.4.7, which is not yet packaged on conda-forge; add it here
    # once it lands on the channel.
    - pystac-client >=0.8.4

test:
  requires:
    - python {{ python_min }}
  imports:
    - pyramids
  commands:
    # verify the `pyramids` console entry point (pyramids.cli:main) is installed and runnable
    - pyramids --help

outputs:
  - name: {{ name }}

  - name: {{ name }}-viz
    build:
      noarch: python
    requirements:
      run:
        - {{ pin_subpackage(name, exact=True) }}
        # conda-forge equivalent of the PyPI `cleopatra[tiles]` extra
        # (cleopatra + mercantile + xyzservices + Pillow).
        - cleopatra-tiles >=0.44.0
    test:
      imports:
        - pyramids

  - name: {{ name }}-lazy
    build:
      noarch: python
    requirements:
      run:
        - {{ pin_subpackage(name, exact=True) }}
        - dask-core >=2024.1.0
        - distributed >=2024.1.0
        - zarr >=3
        - fsspec >=2024.1.0
        - s3fs >=2024.1.0
        # kerchunk + h5py for the NetCDF/HDF5 lazy (Zarr-reference) path.
        # h5py from conda-forge only (PyPI wheels bundle their own HDF5 and
        # DLL-shadow on Windows). hdf5 stays on 1.14.* because the hdf5-2 GDAL
        # builds pin a different AWS-SDK patch than libarrow needs, so hdf5 2.x
        # does not co-solve with arrow/parquet — serapeum-org/pyramids-core#1419.
        - kerchunk >=0.2.10
        - h5py >=3.8.0,<3.17
        - hdf5 1.14.*
    test:
      imports:
        - pyramids

  - name: {{ name }}-parquet
    build:
      noarch: python
    requirements:
      run:
        - {{ pin_subpackage(name ~ '-lazy', exact=True) }}
        - pyarrow >=10.0.0
        - dask-geopandas >=0.5.0
    test:
      imports:
        - pyramids

  - name: {{ name }}-stac
    build:
      noarch: python
    requirements:
      run:
        - {{ pin_subpackage(name, exact=True) }}
        # conda-forge equivalent of the PyPI `stac` extra. stac-asset>=0.4.7 (also
        # part of the PyPI extra) is not yet on conda-forge; add it once available.
        - pystac-client >=0.8.4
    test:
      imports:
        - pyramids

about:
  home: https://github.com/serapeum-org/pyramids-core
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE.md
  summary: GIS utility package
  description: |
    GIS utility package.
  dev_url: https://github.com/serapeum-org/pyramids-core
  doc_url: https://serapeum-org.github.io/pyramids-core
  doc_source_url: https://github.com/serapeum-org/pyramids-core/blob/main/README.md

extra:
  recipe-maintainers:
    - MAfarrag
